spring:
  application:
    name: finguard-backend
  jackson:
    deserialization:
      accept-float-as-int: false
      fail-on-numbers-for-enums: true
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/finguard?connectionTimeZone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
detection:
  enabled: ${DETECTION_ENABLED:true}
  poll-delay-ms: ${DETECTION_POLL_DELAY_MS:2000}
ml:
  enabled: ${ML_ENABLED:true}
  base-url: ${ML_BASE_URL:http://localhost:8000}
  connect-timeout-ms: ${ML_CONNECT_TIMEOUT_MS:300}
  request-timeout-ms: ${ML_REQUEST_TIMEOUT_MS:1000}
